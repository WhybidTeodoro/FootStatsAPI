<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogadores - FootStats</title>
</head>
<body>
    <header>
        <h1>FootStats</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="teams.html">Times</a></li>
                <li><a href="players.html">Jogadores</a></li>
                <li><a href="matches.html">Partidas</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Buscar Jogadores</h2>

            <form>
                <label for="playerName">Nome:</label>
                <input type="text" id="playerName" name="playerName" placeholder="Digite o nome do Jogador">

                <br><br>

                <label for="position">Posição:</label>
                <select name="position" id="position">
                    <option value="">Todas</option>
                    <option value="Atacante">Atacante</option>
                    <option value="Meio-Campo">Meio-Campo</option>
                    <option value="Volante">Volante</option>
                    <option value="Lateral">Lateral</option>
                    <option value="Zagueiro">Zagueiro</option>
                    <option value="Goleiro">Goleiro</option>
                </select>

                <br><br>

                <button type="submit">Buscar</button>
            </form>

        </section>


        <section>
            <h2>Lista de Jogadores</h2>

            <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Posição</th>
                <th>Camisa</th>
                <th>Gols</th>
                <th>Assistências</th>
                <th>Partidas</th>
            </tr>
        </thead>

        <tbody id="playersTable">
            <tr>
                <td>1</td>
                <td>Messi</td>
                <td>Atacante</td>
                <td>10</td>
                <td>30</td>
                <td>12</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
        </section>
    </main>
</body>
</html>
